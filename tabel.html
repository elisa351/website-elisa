<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabel</title>
</head>
<body>
    <h2>Membuat Tabel</h2>
    <h4>Tabel Simpel</h4>
    <table border="1" cellspacing="0" cellpadding="3">
        <tr>
            <td>baris 1,kolom 1</td>
            <td>baris 1,kolom 2</td>
        </tr>
        <tr>
            <td>baris 2,kolom 1</td>
            <td>baris 2,kolom 2</td>
        </tr>
    </table>

    <h4>Tabel Kompleks</h4>
   
    <table border="1" cellspacing="0" cellpadding="3">
        <thead>
<tr>
    <th></th>
    <th>kolom 1</th>
    <th>kolom 2</th>
</tr>
        </thead>
        <tbody>
<tr>
    <th>Baris 1</th>
    <td>Baris 1,Kolom 1</td>
    <td>Baris 1,Kolom 2</td>
</tr>
<tr>
    <th>Baris 2</th>
    <td>Baris 2, Kolom 1</td>
    <td>Baris 2,Kolom 2</td>
</tr>
        </tbody>
    </table>

    <h4>Colspan</h4>
    <table border="1" cellspacing="0" cellpadding="3">

        <tr>
            <td colspan="2">1,1</td>           
            <td>1,3</td>
        </tr>
        <tr>
            <td>2,1</td>
            <td colspan="2">2,2</td>
        </tr>
        <tr>
            <td>3,1</td>
            <td>3,2</td>
            <td>3,3</td>
        </tr>
    </table>

    <h4>rowspan</h4>
    <table border="1" cellspacing="0" cellpadding="3">
        <tr>
            <td rowspan="2">1,1</td>
            <td>1,2</td>
            <td>1,3</td>
        </tr>
        <tr>
            <td>2,2</td>
            <td rowspan="2">2,3</td>
        </tr>
        <tr>
            <td>3,1</td>
            <td>3,2</td>
        </tr>
    </table>
</body>
</html>
